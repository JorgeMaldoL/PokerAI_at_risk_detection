<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>

    <header class="page-header">
      <div class="suit-row" aria-hidden="true">
        <span class="suit-black">&spades;</span>
        <span class="suit-red">&hearts;</span>
        <span class="suit-red">&diams;</span>
        <span class="suit-black">&clubs;</span>
      </div>
      <h1>{{ site.title | default: site.github.repository_name }}</h1>
      <p class="page-subtitle">{{ site.description }}</p>
    </header>

    <main class="wrapper">
      {{ content }}
    </main>

    <footer class="page-footer">
      <p>Built by the {{ site.title }} team.</p>
    </footer>

  </body>
</html>
